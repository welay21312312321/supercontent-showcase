/* Presentation geometry: every slide is authored at 1600 × 900 logical px.
   Viewport rules only size the surrounding viewer, never reflow slide content. */
html:has(.slide-deck){scroll-padding-top:78px;background:#dfe2e8}
body.slide-deck{background:#dfe2e8;padding-top:78px}
.slide-deck .app-header{padding:0 28px;background:#f8f9fbeF;border-bottom:1px solid #cdd2dd}
.slide-deck #main{max-width:none;margin:0;padding:0}
.slide-deck .deck-chapter{margin:0;padding:0;max-width:none;background:#dfe2e8;scroll-margin-top:78px;min-height:0}
.slide-deck .deck-frame{height:calc(100svh - 78px);min-height:0;display:grid;place-items:center;padding:20px 32px 42px;scroll-margin-top:78px;position:relative}
.slide-deck .deck-sheet{position:relative;width:min(1600px,calc(100vw - 64px),calc((100svh - 140px) * 16 / 9));aspect-ratio:16/9;background:#fff;box-shadow:0 10px 40px #1d263523;--deck-scale:1}
.slide-deck .deck-canvas{position:absolute;left:0;top:0;width:1600px;height:900px;transform:scale(var(--deck-scale));transform-origin:0 0;background:var(--paper);color:var(--ink);--paper:#fff;--muted:#596377;--line:#d9deeb;--ink:#10131d}
.slide-deck .dark .deck-canvas{background:#10141f;color:#fff;--paper:#10141f;--muted:#aeb9d0;--line:#303a50;--ink:#fff;--pale:#1b2539}
.slide-deck .deck-content{position:absolute;inset:90px 80px 70px;min-width:0;min-height:0}
.slide-deck .deck-brand{position:absolute;left:80px;right:80px;top:30px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px;font-size:13px;line-height:1.4;letter-spacing:.6px;color:var(--muted)}
.slide-deck .deck-brand>span:first-child{font-size:15px;font-weight:750;letter-spacing:.8px;color:var(--ink)}
.slide-deck .deck-brand i{font-style:normal;color:var(--blue);margin:0 10px}
.slide-deck .deck-footer{position:absolute;left:80px;right:80px;bottom:25px;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;justify-content:space-between;font-size:12px;line-height:1.4;color:var(--muted);margin:0}
.slide-deck .deck-footer>span{display:inline;font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted)}
.slide-deck .deck-number{font-variant-numeric:tabular-nums;letter-spacing:1.2px}
.slide-deck .deck-content .reveal{opacity:1;transform:none;transition:none}
.slide-deck .deck-content p{line-height:1.65}
.slide-deck .deck-content .eyebrow{font-size:13px;line-height:1.45;letter-spacing:1.8px}
.slide-deck .deck-content .section-heading h2{font-size:48px;line-height:1.13;letter-spacing:-1.8px;margin-top:17px;max-width:1300px}
.slide-deck .deck-content .section-lead{font-size:19px;line-height:1.6;max-width:1320px;margin-top:18px}
.slide-deck .deck-content .small-copy,.slide-deck .deck-content .visual-caption{font-size:13px;line-height:1.65}
.slide-deck .deck-content .source-link{font-size:12px;line-height:1.4;padding:2px 0}
.slide-deck .deck-content .pill-tabs{gap:9px}
.slide-deck .deck-content .pill-tabs button{font-size:16px;padding:10px 24px}
.slide-deck .deck-content .chart-footnote{font-size:12px;line-height:1.6;max-width:none;margin-top:17px}
.slide-deck .deck-content .work-player{max-width:100%;width:100%}
.slide-deck .deck-content .work-player figcaption{padding-top:12px;gap:4px}
.slide-deck .deck-content .work-player figcaption>b{font-size:15px;line-height:1.45}
.slide-deck .deck-content .work-player figcaption>span,.slide-deck .deck-content .work-player figcaption>small{font-size:12px;line-height:1.6}
.slide-deck .deck-content .video-frame video{width:100%;height:100%;aspect-ratio:auto;object-fit:contain}

/* Opening */
.slide-deck .deck-kind-cover .deck-content{display:grid;grid-template-columns:1.08fr 1fr;align-items:center;gap:46px}
.slide-deck .deck-kind-cover h1{font-size:73px;line-height:1.13;letter-spacing:-3px;margin-top:28px;font-weight:800}
.slide-deck .deck-kind-cover .hero-name{font-size:20px;margin-top:24px}
.slide-deck .deck-kind-cover .hero-intro{font-size:21px;line-height:1.65;max-width:660px;margin-top:27px}
.slide-deck .deck-kind-cover .hero-actions{margin-top:29px;gap:25px}
.slide-deck .deck-kind-cover .hero-tags{font-size:14px;margin-top:26px}
.slide-deck .deck-kind-cover .hero-visual{height:630px;width:100%;perspective:1200px}
.slide-deck .deck-kind-cover .hero-film{animation:none;transform:rotate(var(--angle));max-height:none}
.slide-deck .deck-kind-cover .film-1{height:420px;top:75px}
.slide-deck .deck-kind-cover .film-2{height:285px;top:30px}
.slide-deck .deck-kind-cover .film-3{height:370px;top:175px}
.slide-deck .deck-kind-cover .product-origin{bottom:58px;width:190px}
.slide-deck .deck-kind-cover .hero-visual-note{font-size:12px;bottom:6px}

/* One shared engine */
.slide-deck .deck-kind-model .section-heading h2{font-size:45px;margin-top:13px}
.slide-deck .deck-kind-model .section-lead{font-size:18px;margin-top:13px}
.slide-deck .deck-content .engine-grid{display:grid;grid-template-columns:1fr 1fr;gap:85px;margin-top:27px;align-items:center}
.slide-deck .deck-content .engine-root{max-width:none;padding:19px 24px;grid-template-columns:80px 1fr;min-height:95px}
.slide-deck .deck-content .engine-root b{font-size:24px}
.slide-deck .deck-content .engine-root>span{font-size:14px}
.slide-deck .deck-content .flow-thread,.slide-deck .deck-content .flow-thread i{height:36px}
.slide-deck .deck-content .account-network{margin-top:18px;gap:11px}
.slide-deck .deck-content .account{min-height:100px;padding:12px 15px;overflow:visible}
.slide-deck .deck-content .account-avatar{width:27px;height:27px;line-height:25px;font-size:12px;margin-bottom:5px}
.slide-deck .deck-content .account b{font-size:16px}
.slide-deck .deck-content .account small{font-size:12px}
.slide-deck .deck-content .engine-visual>.visual-caption{font-size:12px;margin-top:10px}
.slide-deck .deck-content .engine-panel #engine-content{min-height:0;padding-top:25px}
.slide-deck .deck-content .engine-panel h3{font-size:36px;line-height:1.35;margin:15px 0 18px}
.slide-deck .deck-content .engine-panel p:not(.eyebrow){font-size:19px;line-height:1.7}
.slide-deck .deck-content .engine-output{margin-top:22px;padding-left:20px}
.slide-deck .deck-content .engine-output small{font-size:12px}
.slide-deck .deck-content .engine-output b{font-size:18px;margin-top:7px}
.slide-deck .deck-content .definition{margin-top:24px;padding:15px 0;font-size:14px;line-height:1.6}
.slide-deck .deck-content .logic-line{margin-top:5px;font-size:16px;line-height:1.5;gap:18px;justify-content:space-between;flex-wrap:nowrap}

/* Three evidence cards */
.slide-deck .deck-kind-cases .section-heading h2{font-size:44px;line-height:1.1;margin-top:12px}
.slide-deck .deck-kind-cases .section-lead{font-size:18px;line-height:1.5;margin-top:10px}
.slide-deck .deck-content .scenario-meta{display:flex;flex-direction:row;align-items:center;margin-top:12px;gap:20px;min-height:28px}
.slide-deck .deck-content .scenario-meta>p{font-size:13px}
.slide-deck .deck-content .platform{font-size:15px;gap:8px}
.slide-deck .deck-content .platform img{width:23px;height:23px}
.slide-deck .deck-content .experience{font-size:12px}
.slide-deck .deck-content .portfolio-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:21px;margin-top:17px;height:510px;align-items:stretch}
.slide-deck .deck-content .portfolio-card{padding:22px 24px;min-width:0;min-height:0;overflow:visible;display:flex;flex-direction:column}
.slide-deck .deck-content .portfolio-card>header{min-height:92px}
.slide-deck .deck-content .case-type{font-size:12px;line-height:1.5}
.slide-deck .deck-content .portfolio-card h4{font-size:24px;line-height:1.35;letter-spacing:-.5px;margin-top:13px;font-weight:750}
.slide-deck .deck-content .portfolio-card .card-lesson{font-size:14px;line-height:1.65;margin-top:auto;padding-top:13px}
.slide-deck .deck-content .card-lesson>b{font-size:12px;line-height:1.5;margin-bottom:5px}
.slide-deck .deck-content .portfolio-card>footer{font-size:11px;line-height:1.6;padding-top:12px;margin-top:13px}
.slide-deck .deck-content .portfolio-card>footer .source-link{margin-top:5px;font-size:11px}
.slide-deck .deck-content .volume-art{min-height:0;height:205px;margin-top:4px;flex-shrink:0}
.slide-deck .deck-content .volume-art>strong{font-size:72px}
.slide-deck .deck-content .volume-art small{font-size:16px;margin-top:12px}
.slide-deck .deck-content .mini-tiles{inset:8px 15px;gap:7px}
.slide-deck .deck-content .mini-tiles i{height:39px}
.slide-deck .deck-content .platform-duo{min-height:0;height:205px;gap:14px;padding:8px 0;flex-shrink:0}
.slide-deck .deck-content .platform-duo>div+div{padding-top:13px}
.slide-deck .deck-content .platform-duo span{font-size:13px}
.slide-deck .deck-content .platform-duo strong{font-size:42px;line-height:1.15}

function changeLocale(locale,remember=true){

  translateContent();const b=$('#deck-language');b.setAttribute('aria-pressed',String(currentLocale==='en'));b.setAttribute('aria-label',currentLocale==='en'?'Switch to Chinese':'切换到英文');b.title=currentLocale==='en'?'Switch to Chinese':'切换到英文';
  document.title=currentLocale==='en'?(englishCopy[normalizeCopy(originalDocumentTitle)]||'SuperContent Clipo | UGC & Content Growth'):originalDocumentTitle;
  if(remember){try{localStorage.setItem('sc-v20-locale',currentLocale);}catch{}const url=new URL(location.href);if(currentLocale==='en')url.searchParams.set('lang','en');else url.searchParams.delete('lang');history.replaceState(null,'',url.pathname+url.search+url.hash);}
  filterCatalog();setDeckPosition(deckActive);
}
$('#deck-language').onclick=()=>changeLocale(currentLocale==='zh'?'en':'zh');
let preferredLocale=new URLSearchParams(location.search).get('lang');if(!preferredLocale){try{preferredLocale=localStorage.getItem('sc-v20-locale');}catch{}}
changeLocale(preferredLocale||'zh',false);
const localeObserver=new MutationObserver(()=>{if(localeQueued)return;localeQueued=true;queueMicrotask(()=>{localeQueued=false;translateContent();});});
localeObserver.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['aria-label','title','alt','placeholder']});

})();
</script></body></html>
